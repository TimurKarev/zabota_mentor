# Dev environment (Story 1.1c): app + worker + Postgres 17 + Redis 8.
#
# Usage: `docker compose up -d` then check http://localhost:8000/health
# Ports are bound to 127.0.0.1 only; credentials default to throwaway dev
# values and can be overridden via a gitignored `.env` (see .env.example).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabota}
      POSTGRES_USER: ${POSTGRES_USER:-zabota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabota}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabota} -d ${POSTGRES_DB:-zabota}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # Forward-looking (AD-4): dedup/pacing only, not wired until Story 1.6 —
    # included now to match the architecture dev stack.
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER:-zabota}:${POSTGRES_PASSWORD:-zabota}@postgres:5432/${POSTGRES_DB:-zabota}
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-zabota}:${POSTGRES_PASSWORD:-zabota}@postgres:5432/${POSTGRES_DB:-zabota}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    # Same image as app; only the command differs.
    build: .
    command: python -m src.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zabota}:${POSTGRES_PASSWORD:-zabota}@postgres:5432/${POSTGRES_DB:-zabota}

volumes:
  postgres_data:
