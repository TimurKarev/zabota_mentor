# Staging environment (Story 1.2 deploy): same topology as dev, but for a
# long-lived server VM. Differences from docker-compose.yml:
#   - restart: unless-stopped on every service (bot must survive reboots)
#   - no throwaway credential defaults — POSTGRES_PASSWORD is required (:?err)
#   - BOT_TOKEN comes from the server-side .env (never committed)
#   - polling transport: no public URL/TLS/webhook needed (prod will switch to
#     BOT_MODE=webhook per .env.example)
#
# Usage on the VM:
#   cp .env.example .env   # then set POSTGRES_* and BOT_TOKEN
#   docker compose -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml run --rm app \
#     python -m src.adapters.db.migrate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabota_staging}
      POSTGRES_USER: ${POSTGRES_USER:-zabota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabota} -d ${POSTGRES_DB:-zabota_staging}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # AD-4 stack parity: dedup/pacing — not wired until Story 1.6.
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  warp:
    # SOCKS5 egress via Cloudflare WARP: RU-hosted networks block
    # api.telegram.org, so Bot API traffic is routed through this tunnel
    # (TG_PROXY_URL=socks5://warp:1080). wireproxy is userspace WireGuard —
    # no NET_ADMIN needed; no official docker image exists, so the static
    # release binary lives on the VM in ./warp/wireproxy (downloaded per
    # docs/ops-staging.md). The WARP profile is registered off-box (RU networks
    # DNS-poison api.cloudflareclient.com) in ./warp/wireproxy.conf
    # (chmod 600, never committed — contains PrivateKey).
    # Swap transports (own VPS, VLESS) by changing TG_PROXY_URL only.
    image: alpine:3.21
    command: ["/opt/wireproxy", "-c", "/etc/wireguard/wireproxy.conf"]
    volumes:
      - ./warp/wireproxy.conf:/etc/wireguard/wireproxy.conf:ro
      - ./warp/wireproxy:/opt/wireproxy:ro
    ports:
      # Loopback-only: for host-side egress tests (curl --socks5-hostname).
      - "127.0.0.1:1080:1080"
    restart: unless-stopped

  app:
    build: .
    image: zabota-mentor:staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      warp:
        # wireproxy ships no healthcheck; readiness is verified by the app's
        # polling logs (and by the egress curl in docs/ops-staging.md).
        condition: service_started
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER:-zabota}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-zabota_staging}
      BOT_MODE: polling
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      TG_PROXY_URL: ${TG_PROXY_URL:-socks5://warp:1080}
    ports:
      # Loopback-only on the VM: no inbound from the internet; reachable for
      # debugging via SSH tunnel (ssh -L 8000:localhost:8000 ...).
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    image: zabota-mentor:staging
    command: python -m src.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zabota}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-zabota_staging}
    restart: unless-stopped

volumes:
  postgres_staging_data:
